{% load static %}

<article class="question-card answer-card" id="answer-{{answer.id}}">
  <div class="question-vote">
    {% if answer.user.userprofile.avatar %}
      <img class="question-avatar"
      src="{{ answer.user.userprofile.avatar.url }}"
      alt="Аватар автора ответа">
    {% else %}
      <img class="question-avatar"
      src="{% static 'questions/img/pumpkin.svg' %}"
      alt="Аватар автора ответа">
    {% endif %}

    <div class="question-vote-controls" data-vote-url="{{ question.get_absolute_url }}" data-action="vote_answer" data-answer-id="{{ answer.pk }}">
      <button type="button" data-value="1" class="{% if answer.user_vote == 1 %}vote-active{% endif %}" aria-pressed="{% if answer.user_vote == 1 %}true{% else %}false{% endif %}" aria-label="Поставить плюс" {% if not user.is_authenticated %}disabled title="Войдите, чтобы оценить ответ"{% elif answer.user_vote == 1 %}disabled title="Вы уже поставили эту оценку"{% endif %}>▲</button>
      <span data-rating aria-live="polite">{{answer.rating}}</span>
      <button type="button" data-value="-1" class="{% if answer.user_vote == -1 %}vote-active{% endif %}" aria-pressed="{% if answer.user_vote == -1 %}true{% else %}false{% endif %}" aria-label="Поставить минус" {% if not user.is_authenticated %}disabled title="Войдите, чтобы оценить ответ"{% elif answer.user_vote == -1 %}disabled title="Вы уже поставили эту оценку"{% endif %}>▼</button>
    </div>
  </div>

  <div class="question-content">
    <p>
      {{answer.content}}
    </p>

    <div class="question-meta">
      <time datetime="{{ answer.created_at|date:'c' }}">
        {{ answer.created_at|date:"d.m.Y H:i" }}
      </time>
    </div>

    {% if user.is_authenticated and user.id == question.user_id %}
      <label class="answer-correct">
        <input type="checkbox" data-correct-url="{{ question.get_absolute_url }}" data-answer-id="{{ answer.pk }}" {% if answer.is_correct %} checked {% endif %}>
          Правильный ответ
      </label>
    {% elif answer.is_correct %}
      <span class="answer-correct">✓ Правильный ответ</span>
    {% endif %}
  </div>
</article>
