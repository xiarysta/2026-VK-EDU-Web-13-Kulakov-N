{% if form.non_field_errors %}
  <div class="auth-form-error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="ask-form-row">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <div class="ask-form-field">
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {% for error in field.errors %}<p class="auth-field-error" role="alert">{{ error }}</p>{% endfor %}
    </div>
  </div>
{% endfor %}
